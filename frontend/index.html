<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Detection - IBM Cloud Demo</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 400px;
      max-width: 90%;
    }

    h1 {
      text-align: center;
      color: #2575fc;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #2575fc;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #1a5ed1;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      color: white;
      font-size: 0.85em;
      position: fixed;
      bottom: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fraud Detection</h1>
    <form id="fraudForm">
      <label>Step:</label>
      <input type="number" id="step" placeholder="e.g. 1" required>

      <label>Transaction Type:</label>
      <select id="type" required>
        <option value="PAYMENT">PAYMENT</option>
        <option value="TRANSFER">TRANSFER</option>
        <option value="CASH_OUT">CASH_OUT</option>
        <option value="DEBIT">DEBIT</option>
      </select>

      <label>Amount:</label>
      <input type="number" id="amount" step="0.01" required>

      <label>Sender Account ID:</label>
      <input type="text" id="nameOrig" placeholder="e.g. ORIG456" required>

      <label>Old Balance (Sender):</label>
      <input type="number" id="oldbalanceOrg" step="0.01" required>

      <label>New Balance (Sender):</label>
      <input type="number" id="newbalanceOrig" step="0.01" required>

      <label>Receiver Account ID:</label>
      <input type="text" id="nameDest" placeholder="e.g. DEST123" required>

      <label>Old Balance (Receiver):</label>
      <input type="number" id="oldbalanceDest" step="0.01" required>

      <label>New Balance (Receiver):</label>
      <input type="number" id="newbalanceDest" step="0.01" required>

      <button type="submit">Predict Fraud</button>
    </form>

    <div id="result"></div>
    <div id="error"></div>
  </div>

  <footer>Powered by IBM Watsonx.ai & Node.js</footer>

  <script>
    const BACKEND_URL = "http://localhost:5000/predict";

    document.getElementById("fraudForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("error").innerText = "";
      document.getElementById("result").innerText = "Processing...";

      const payload = {
        input_data: [
          {
            fields: ["step", "type", "amount", "nameOrig", "oldbalanceOrg", "newbalanceOrig", "nameDest", "oldbalanceDest", "newbalanceDest"],
            values: [[
              parseFloat(document.getElementById("step").value),
              document.getElementById("type").value,
              parseFloat(document.getElementById("amount").value),
              document.getElementById("nameOrig").value,
              parseFloat(document.getElementById("oldbalanceOrg").value),
              parseFloat(document.getElementById("newbalanceOrig").value),
              document.getElementById("nameDest").value,
              parseFloat(document.getElementById("oldbalanceDest").value),
              parseFloat(document.getElementById("newbalanceDest").value)
            ]]
          }
        ]
      };

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const result = await res.json();
        console.log(result);

        const prediction = result.predictions[0].values[0][0];
        document.getElementById("result").innerHTML =
          prediction === 1
            ? "⚠️ <span style='color:red;'>Fraud Detected!</span>"
            : "✅ <span style='color:green;'>Transaction is Legitimate</span>";
      } catch (error) {
        console.error("Error:", error);
        document.getElementById("result").innerText = "";
        document.getElementById("error").innerText = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
